name: CI

# pull_request는 팀 저장소에서 Actions가 활성화되면 자동으로 동작한다.
# push는 브랜치를 제한하지 않는다. 개인 Fork에 작업 브랜치를 올리는 것만으로도
# 검증이 돌기 때문에, 팀 저장소 설정과 무관하게 머지 전에 문제를 잡을 수 있다.
on:
  pull_request:
    branches: [main]
  push:

jobs:
  test:
    name: 테스트 (H2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: JDK 21 설정
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 테스트 실행
        run: ./gradlew test --no-daemon

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test

  mysql-boot:
    name: 기동 검증 (MySQL 8.4)
    runs-on: ubuntu-latest

    # 로컬 H2에서는 통과하지만 배포 MySQL에서 깨지는 문제를 잡기 위한 잡이다.
    # Flyway 마이그레이션 적용과 Hibernate 스키마 검증이 여기서 실제로 수행된다.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: azasyu
          MYSQL_USER: azasyu
          MYSQL_PASSWORD: azasyu
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uazasyu -pazasyu"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - uses: actions/checkout@v7

      - name: JDK 21 설정
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 애플리케이션 빌드
        run: ./gradlew bootJar --no-daemon

      - name: prod 프로필로 기동 확인
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_URL: jdbc:mysql://127.0.0.1:3306/azasyu?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
          DB_USERNAME: azasyu
          DB_PASSWORD: azasyu
          JWT_SECRET: ci-only-secret-key-with-at-least-32-bytes
          GEMINI_API_KEY: ''
          APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
        run: |
          java -jar build/libs/*.jar > app.log 2>&1 &
          APP_PID=$!

          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "기동 성공"
              grep -E "applied|validated" app.log || true
              kill $APP_PID 2>/dev/null || true
              exit 0
            fi
            if grep -qE "APPLICATION FAILED TO START|Application run failed" app.log; then
              echo "::error::애플리케이션 기동 실패"
              cat app.log
              exit 1
            fi
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "::error::프로세스가 예기치 않게 종료됨"
              cat app.log
              exit 1
            fi
            sleep 2
          done

          echo "::error::기동 타임아웃 (120초)"
          cat app.log
          exit 1

      - name: 실패 시 로그 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-log
          path: app.log
