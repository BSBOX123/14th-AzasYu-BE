services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: azasyu
      MYSQL_USER: azasyu
      MYSQL_PASSWORD: azasyu
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uazasyu", "-pazasyu"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
